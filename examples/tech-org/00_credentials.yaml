credentials:
  - name: native-channel
    type: native-channel
  - name: slack-channel
    type: slack-channel
    variables:
      app_token: {{SLACK_APP_TOKEN}}
  - name: anthropic
    type: ai-worker
    variables:
      api_token: {{ANTHROPIC_API_TOKEN}}
  - name: anthropic-native-channel
    type: worker-native-token
    variables:
      token: {{ANTHROPIC_NATIVE_CHANNEL_TOKEN}}
  - name: anthropic-slack
    type: worker-slack-token
    variables:
      token: {{SLACK_BOT_TOKEN}}
  - name: github-repo
    type: github-repo-resource
    variables:
      username: {{GITHUB_REPO_ACCESS_USERNAME}}
      access_token: {{GITHUB_REPO_ACCESS_TOKEN}}
  - name: github-pull-request
    type: github-pull-request-resource
    variables:
      access_token: {{GITHUB_PULL_REQUEST_ACCESS_TOKEN}}
  - name: github-board-ticket-tool
    type: github-board-ticket-tool
    variables:
      access_token: {{GITHUB_BOARD_ACCESS_TOKEN}}
  - name: github-board-tracker
    type: github-board-tracker
    variables:
      access_token: {{GITHUB_BOARD_ACCESS_TOKEN}}
  - name: google-slides-tool
    type: google-slides-tool
    variables:
      client_id: {{GOOGLE_SLIDES_CLIENT_ID}}
      client_secret: {{GOOGLE_SLIDES_CLIENT_SECRET}}
      oauth2_audience: {{GOOGLE_SLIDES_OAUTH2_AUDIENCE}}
  - name: google-drive-tool
    type: google-drive-tool
    variables:
      client_id: {{GOOGLE_DRIVE_CLIENT_ID}}
      client_secret: {{GOOGLE_DRIVE_CLIENT_SECRET}}
      oauth2_audience: {{GOOGLE_DRIVE_OAUTH2_AUDIENCE}}

  