name: customer-success-chat
description: Extract Requirements
type: simple-task
purpose: Extract requirements from the customer.
requiredSkills:
  - conversation
inputs:
  message: native-channel
  role: customer-success-role
  chat_instructions: customer-success-instructions-chat
triggers:
  - native-channel
subtasks:
  - name: create-bug-report
  - name: create-feature-request
  - name: create-product-idea
variables:
  system_message_template: |-
    {{role}}
    {{chat_instructions}}
  prompt_template: |-
    {{message}}