repo_variables: &repo_variables
  repo: {{INSTRUCTION_REPO}}
  owner: {{INSTRUCTION_OWNER}}
  org_name: {{INSTRUCTION_ORG_NAME}}
  branch: {{INSTRUCTION_BRANCH}}

repo_defaults: &repo_defaults
  description: A Github resource.
  type: github-repo-resource
  credential: github-repo

tracker_variables: &tracker_variables
  in_progress_column: In Progress
  done_column: Done
  org_name: {{GITHUB_TRACKER_ORG_NAME}}
  project_name: {{GITHUB_BUG_PROJECT_NAME}}

flows:
- name: Customer Success
  description: Chat with the customer to understand their needs
  status: inactive

  channels:
  - name: Native Channel
    description: Native Channel
    type: native-channel
    variables:
      channel_name: {{NATIVE_CHANNEL_NAME}}
      anonymous_access: {{NATIVE_CHANNEL_ANONYMOUS}}
      oauth2_issuer_uri: {{NATIVE_CHANNEL_OAUTH2_ISSUER_URI}}
      oauth2_audience: {{NATIVE_CHANNEL_OAUTH2_AUDIENCE}}

  resources:
  - name: Role
    <<: *repo_defaults
    variables:
      path_template: {{CUSTOMER_SUCCESS_INSTRUCTION_ROLE_PATH}}
      <<: *repo_variables
  - name: Chat Instructions
    <<: *repo_defaults
    variables:
      path_template: {{CUSTOMER_SUCCESS_INSTRUCTION_CHAT_PATH}}
      <<: *repo_variables
  - name: Feature Instructions
    <<: *repo_defaults
    variables:
      path_template: {{CUSTOMER_SUCCESS_INSTRUCTION_FEATURE_PATH}}
      <<: *repo_variables
  - name: Product Idea Instructions
    <<: *repo_defaults
    variables:
      path_template: {{CUSTOMER_SUCCESS_INSTRUCTION_PRODUCT_IDEA_PATH}}
      <<: *repo_variables
  - name: Bug Instructions
    <<: *repo_defaults
    variables:
      path_template: {{CUSTOMER_SUCCESS_INSTRUCTION_BUG_REPORT_PATH}}
      <<: *repo_variables
  
  trackers:
  - name: Feature Requests
    description: A Github Board Tracker.
    type: github-board-tracker
    variables:
      to_do_column: New Feature
      <<: *tracker_variables
  - name: Product Ideas
    description: A Github Board Tracker.
    type: github-board-tracker
    variables:
      to_do_column: New Idea
      <<: *tracker_variables
  - name: bug-report-ticket
    description: A Github Board Tracker.
    type: github-board-tracker
    variables:
      to_do_column: New Bug
      <<: *tracker_variables
    
  tasks:
  - name: Chat
    description: Extract Requirements
    type: simple-task
    purpose: Extract requirements from the customer.
    requiredSkills:
      - conversation
    inputs:
      message: Native Channel
      role: Role
      chat_instructions: Chat Instructions
    triggers:
      - Native Channel
    subtasks:
      - name: Bug Report
      - name: Feature Request
      - name: Product Idea
    variables:
      system_message_template: |-
        {{role}}
        {{chat_instructions}}
      prompt_template: |-
        {{message}}
  - name: Feature Request
    description: Create a feature request
    type: simple-task
    requiredSkills:
      - conversation
    purpose: Create a feature request from the extracted requirements.
    inputs:
      role: Role
      instructions: Feature Instructions
      message: Chat
    outputs:
      - Feature Requests
    variables:
      system_message_template: |-
        {{role}}
        {{instructions}}
      prompt_template: |-
        {{message}}
  - name: Product Idea
    description: Create a product idea
    type: simple-task
    requiredSkills:
      - conversation
    purpose: Create a product idea from the extracted requirements.
    inputs:
      role: Role
      instructions: Product Idea Instructions
      message: Chat
    outputs:
      - Product Ideas
    variables:
      system_message_template: |-
        {{role}}
        {{instructions}}
      prompt_template: |-
        {{message}}

  - name: Bug Report
    description: Create a bug report
    type: simple-task
    requiredSkills:
      - conversation
    purpose: Create a bug report from the extracted requirements.
    inputs:
      role: Role
      instructions: Bug Instructions
      message: Chat
    outputs:
      - bug-report-ticket
    variables:
      system_message_template: |-
        {{role}}
        {{instructions}}
      prompt_template: |-
        {{message}}

